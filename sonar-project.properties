sonar.projectKey=EnzoTurpin_MyTripCircle
sonar.organization=enzoturpin

# Encodage des sources, sinon le scanner retombe sur celui de la plateforme.
sonar.sourceEncoding=UTF-8

# Fichiers hors périmètre d'analyse. Indispensable depuis que l'analyse tourne
# dans la CI : le rapport HTML de couverture et les dépendances installées sont
# alors présents sur le disque du runner et seraient sinon analysés comme du
# code source du projet.
sonar.exclusions=coverage/**,node_modules/**,android/**,ios/**,.expo/**,assets/**

# Exclure les fichiers i18n et les données statiques de la détection de duplication.
# Les fichiers de traduction partagent la même structure de clés par conception (une par langue),
# et les fiches de destination ont un schéma commun intentionnel.
sonar.cpd.exclusions=src/utils/i18n/**,src/data/**

# Couverture de tests : rapport LCOV généré par `npm run test:coverage`
# (et uploadé par la CI — voir .github/workflows/ci.yml).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fichiers exclus de la mesure de couverture. Cette liste doit rester le miroir
# des omissions de `collectCoverageFrom` dans jest.config.js : tout écart fait
# diverger le pourcentage affiché par SonarCloud de celui produit localement.
sonar.coverage.exclusions=**/__tests__/**,**/*.d.ts,src/types/**,src/services/api/index.ts,src/data/**,src/utils/i18n/**,server/index.js,server/db.js,scripts/start-with-qr.js,scripts/update-ip.js,scripts/create-test-user.js,tests/load/**,babel.config.js,metro.config.js,jest.config.js,ios/**,android/**,coverage/**

# Périmètre analysé : tout le dépôt, moins les exclusions ci-dessus.
sonar.sources=.

# Tests : aide Sonar à distinguer code applicatif et code de test.
# `sonar.tests` doit désigner la même racine que `sonar.sources` et non les
# répertoires src/ et server/ : ces derniers étant alors considérés comme
# entièrement composés de tests, tout ce qui n'y correspondait pas aux
# inclusions ci-dessous était purement et simplement ignoré par l'analyse.
sonar.tests=.
sonar.test.inclusions=**/__tests__/**/*.test.ts,**/__tests__/**/*.test.tsx,**/__tests__/**/*.test.js
