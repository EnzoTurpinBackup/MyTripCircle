name: CI

# Intégration continue : à chaque push sur main et à chaque pull request,
# installation propre des dépendances, vérification de types, exécution de la
# suite de tests (client + serveur) avec couverture, et audit des dépendances.

on:
  push:
    # `develop` est la branche d'intégration : sans elle, aucune analyse de
    # branche n'a lieu entre deux passages sur main, et SonarCloud n'a alors
    # jamais de mesure d'ensemble (couverture, dette) à jour.
    branches: [main, develop]
  pull_request:

# Annule un run en cours si un nouveau commit est poussé sur la même réf.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests & audit
    runs-on: ubuntu-latest
    env:
      # Booléen dérivé du secret : permet de conditionner l'étape SonarCloud
      # sans exposer le jeton aux autres étapes du job (`secrets` n'est pas
      # utilisable dans un `if`).
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Historique complet : requis pour l'analyse SonarCloud (git blame).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      # `--ignore-scripts` neutralise les scripts de cycle de vie des
      # dépendances : un paquet compromis ne peut plus exécuter de code sur le
      # runner au moment de l'installation (règle Sonar S6505). Vérifié sans
      # effet sur la CI, qui ne fait que typer, tester et auditer.
      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Vérification de types (TypeScript)
        run: npm run typecheck

      - name: Tests + couverture (client + serveur)
        run: npm run test:coverage -- --ci

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # Barrière bloquante : aucune vulnérabilité critique n'est tolérée.
      - name: Audit des dépendances (bloquant sur critique)
        run: npm audit --audit-level=critical

      # Rapport informatif des vulnérabilités restantes (high / moderate).
      # Elles proviennent toutes de la chaîne metro → image-size de l'outillage
      # de build Expo/React Native, pour laquelle aucun correctif amont n'est
      # publié : échouer dessus rendrait la CI rouge en permanence sans action
      # possible. Durcir en `--audit-level=high` dès qu'image-size est corrigé.
      - name: Rapport des vulnérabilités restantes
        if: always()
        run: |
          npm audit --json > audit.json || true
          node scripts/audit-report.js < audit.json >> "$GITHUB_STEP_SUMMARY"

      # Analyse depuis la CI et non par l'analyse automatique SonarCloud : le
      # scanner a ici besoin de `node_modules` pour résoudre le tsconfig hérité
      # d'`expo/tsconfig.base`, et de coverage/lcov.info produit par les tests.
      # L'étape reste inerte tant que le secret `SONAR_TOKEN` n'est pas ajouté
      # dans Settings → Secrets and variables → Actions du dépôt.
      - name: Analyse SonarCloud
        # Le plan SonarCloud n'analyse que la branche principale : sur les
        # autres pushes le rapport est envoyé puis ignoré. Les pull requests,
        # elles, sont bien analysées.
        if: env.HAS_SONAR_TOKEN == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        # Action tierce épinglée sur un SHA de commit : un tag reste mutable et
        # pourrait être repointé vers du code malveillant (règle Sonar S7637).
        # Relever le SHA et le commentaire ensemble lors des montées de version.
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
